name: Supabase wakker houden

# Een gratis Supabase-project pauzeert na 7 dagen zonder gebruik.
# Deze taak doet elke drie dagen één klein leesverzoek. Zet hiervoor de
# repository secrets SUPABASE_URL en SUPABASE_PUBLISHABLE_KEY (zie SETUP.md).

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Klein verzoek naar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Secrets SUPABASE_URL en SUPABASE_PUBLISHABLE_KEY ontbreken; overslaan."
            exit 0
          fi
          curl -fsS "$SUPABASE_URL/rest/v1/games?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -o /dev/null
          echo "Supabase is wakker."
